<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prime Connect - نظام الموظفين</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap');
  :root {
    --black: #141110; --gold: #b8873b; --gold-light: #d9b876; --ivory: #f6f1e7;
    --bronze: #6b4f2a; --success: #4c7a5d; --alert: #a6472f; --text-dark: #221e1b; --line: #e6ddc9;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--ivory); font-family:'Cairo','Segoe UI',Tahoma,sans-serif; direction:rtl; color:var(--text-dark); }
  #app { max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:80px; }

  #loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--black); padding:20px; }
  .login-card { background:var(--ivory); border-radius:14px; padding:30px 24px; width:100%; max-width:340px; border-top:4px solid var(--gold); }
  .login-card .brand { font-family:'Amiri',serif; font-size:26px; color:var(--bronze); text-align:center; font-weight:700; }
  .login-card .sub { text-align:center; font-size:12.5px; color:#8a7f6f; margin-bottom:22px; }
  .login-card .field { margin-bottom:12px; }
  .login-card label { display:block; font-size:12px; color:#6b6156; margin-bottom:4px; }
  .login-card input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:14px; background:#fff; }
  .login-card button { width:100%; background:var(--black); color:var(--gold-light); border:none; border-radius:8px; padding:12px; font-weight:700; font-family:inherit; font-size:14px; margin-top:6px; }
  .login-error { color:var(--alert); font-size:12.5px; margin-top:8px; text-align:center; min-height:16px; }

  .header { background: var(--black); color: var(--ivory); padding: 18px 18px 14px; border-bottom: 3px solid var(--gold); display:flex; justify-content:space-between; align-items:flex-start; }
  .header .brand { font-family: 'Amiri', serif; font-weight: 700; font-size: 22px; color: var(--gold-light); }
  .header .sub { font-size: 12px; color: #cbbfa0; margin-top: 2px; }
  .header .tab-title { margin-top: 12px; font-size: 17px; font-weight: 600; }
  .header .who { font-size:11.5px; color:#cbbfa0; text-align:left; }
  .header .logout { background:none; border:1px solid #4a423a; color:#cbbfa0; border-radius:6px; padding:4px 10px; font-size:11px; margin-top:6px; font-family:inherit; }

  .content { padding: 14px 14px 8px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--black); color: var(--ivory); border-radius: 10px; padding: 14px; border-left: 3px solid var(--gold); }
  .stat-card .num { font-family: 'Amiri', serif; font-size: 24px; color: var(--gold-light); font-weight: 700; }
  .stat-card .label { font-size: 12px; color: #cbbfa0; margin-top: 2px; }

  .search-box { background: var(--black); border-radius: 12px; padding: 14px; margin-bottom: 18px; }
  .search-box .lbl { color: var(--gold-light); font-size: 13.5px; font-weight: 600; margin-bottom: 8px; }
  .search-box select { width: 100%; padding: 10px; border-radius: 8px; border: none; font-family: inherit; font-size: 13.5px; margin-bottom: 8px; }
  .search-box button { width: 100%; background: var(--gold); color: var(--black); border: none; border-radius: 8px; padding: 10px; font-weight: 700; font-family: inherit; font-size: 13.5px; }

  .section-title { font-weight: 600; font-size: 15px; margin: 18px 0 8px; color: var(--bronze); }
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--gold); color: var(--black); border-radius: 20px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; margin-bottom: 12px; }
  .filter-chip button { background: none; border: none; color: var(--black); font-weight: 700; font-size: 13px; cursor: pointer; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .card .row1 { display: flex; justify-content: space-between; align-items: flex-start; }
  .card .name { font-weight: 700; font-size: 15px; }
  .card .meta { font-size: 12.5px; color: #6b6156; margin-top: 3px; line-height: 1.6; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .badge.lead { background: #eee0c0; color: var(--bronze); }
  .badge.negotiating { background: #fbe3cf; color: #8a4a1e; }
  .badge.contract { background: #d9e6de; color: var(--success); }
  .badge.active { background: var(--gold); color: var(--black); }
  .badge.new { background: #eee0c0; color: var(--bronze); }
  .badge.interview { background: #fbe3cf; color: #8a4a1e; }
  .badge.submitted { background: #dbe3ee; color: #2f4a6b; }
  .badge.hired { background: #d9e6de; color: var(--success); }
  .badge.rejected { background: #f0d9d3; color: var(--alert); }
  .badge.pending { background: #eee0c0; color: var(--bronze); }
  .badge.confirmed { background: #dbe3ee; color: #2f4a6b; }
  .badge.paid { background: #d9e6de; color: var(--success); }
  .badge.open { background: #d9e6de; color: var(--success); }
  .badge.filled { background: #dbe3ee; color: #2f4a6b; }
  .badge.paused { background: #eee0c0; color: var(--bronze); }
  .badge.none { background: #eee; color: #6b6156; }
  .badge.scheduled { background: #dbe3ee; color: #2f4a6b; }
  .badge.done { background: #d9e6de; color: var(--success); }
  .badge.accepted { background: #d9e6de; color: var(--success); }
  .badge.started { background: var(--gold); color: var(--black); }
  .sub-row { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  .sub-row:first-of-type { border-top:none; }
  .sub-row .who2 { font-weight:600; }
  .tiny { font-size:11.5px; color:#8a7f6f; }
  .links a { color: var(--bronze); font-size:12px; margin-left:10px; text-decoration:none; font-weight:600; }
  .progress { height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; }
  .progress i { display:block; height:100%; background:var(--success); }
  .back-link { background:none; border:none; color:var(--bronze); font-family:inherit; font-size:13px; padding:0; margin-bottom:10px; cursor:pointer; }
  .export-btn { width:100%; background:none; border:1px dashed var(--gold); color:var(--bronze); border-radius:8px; padding:9px; font-family:inherit; font-size:13px; margin:6px 0 14px; }
  .badge.owner { background: var(--gold); color:var(--black); }
  .badge.staff { background:#dbe3ee; color:#2f4a6b; }

  .pos-card { background: var(--black); border-radius: 10px; padding: 13px 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .pos-card .ptitle { color: var(--gold-light); font-weight: 700; font-size: 15px; }
  .pos-card .pcat { color: #cbbfa0; font-size: 12px; margin-top: 2px; }
  .pos-card .pcount { background: var(--gold); color: var(--black); border-radius: 20px; padding: 5px 12px; font-weight: 700; font-size: 13px; }

  .card-actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .mini-btn { font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; color: var(--bronze); }
  .mini-btn.danger { color: var(--alert); border-color: #ecd2ca; }

  .empty { text-align: center; padding: 30px 10px; color: #9a8f7f; font-size: 13.5px; }

  .fab { position: fixed; bottom: 88px; left: auto; right: 18px; width: 48px; height: 48px; border-radius: 50%; background: var(--gold); color: var(--black); font-size: 24px; border: none; box-shadow: 0 3px 10px rgba(0,0,0,0.25); }

  .form-card { background: #fff; border: 1px solid var(--gold); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .form-card h4 { margin: 0 0 10px; font-size: 15px; color: var(--bronze); }
  .field { margin-bottom: 9px; }
  .field label { display: block; font-size: 12px; color: #6b6156; margin-bottom: 3px; }
  .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; font-family: inherit; font-size: 13.5px; background: var(--ivory); color: var(--text-dark); }
  .field textarea { resize: vertical; min-height: 50px; }
  .perm-list { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--ivory); margin-bottom: 6px; }
  .perm-row { display:flex; align-items:center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .perm-row:last-child { border-bottom:none; }
  .perm-row input { width: auto; }
  .form-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-primary { flex: 1; background: var(--black); color: var(--gold-light); border: none; border-radius: 8px; padding: 10px; font-weight: 600; font-family: inherit; font-size: 13.5px; }
  .btn-secondary { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-family: inherit; font-size: 13.5px; color: #6b6156; }
  .form-error { color: var(--alert); font-size:12.5px; margin-top:6px; }

  .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--black); display: flex; border-top: 1px solid #2b2723; }
  .nav button { flex: 1; background: none; border: none; color: #cbbfa0; padding: 10px 2px 8px; font-family: inherit; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .nav button .icon { font-size: 16px; }
  .nav button.active { color: var(--gold-light); }
  .loading { text-align: center; padding: 40px; color: #9a8f7f; font-size: 13px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="brand">Prime Connect</div>
    <div class="sub">نظام الموظفين والوظائف — تسجيل الدخول</div>
    <div class="field"><label>اسم المستخدم</label><input id="loginUser" autocomplete="username" /></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" autocomplete="current-password" /></div>
    <button id="loginBtn">دخول</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div>
      <div class="brand">Prime Connect</div>
      <div class="sub">بنك الموظفين والوظائف</div>
      <div class="tab-title" id="tabTitle">لوحة التحكم</div>
    </div>
    <div>
      <div class="who" id="whoAmI"></div>
      <button class="logout" id="pwBtn">كلمة المرور</button>
      <button class="logout" id="logoutBtn">خروج</button>
    </div>
  </div>
  <div class="content" id="content"><div class="loading">جاري التحميل...</div></div>
  <button class="fab" id="fabBtn" style="display:none">+</button>
  <div class="nav" id="navBar"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  var me = null;
  var state = { positions: [], candidates: [], clients: [], placements: [], users: [], requests: [], submissions: [] };
  var clientDetailId = null;
  var currentTab = 'dashboard';
  var formOpen = null;
  var positionFilter = null;

  var contentEl = document.getElementById('content');
  var tabTitleEl = document.getElementById('tabTitle');
  var fabBtn = document.getElementById('fabBtn');
  var navBar = document.getElementById('navBar');
  var titles = { dashboard:'لوحة التحكم', positions:'الوظائف', candidates:'المرشحين', clients:'العملاء', placements:'التوظيفات', users:'الحسابات والصلاحيات', requests:'طلبات الشركات', clientDetail:'ملف الشركة' };

  var PERMISSION_LABELS = {
    positionsManage: 'إدارة الوظائف (إضافة / تعديل / حذف)',
    candidatesView: 'عرض والبحث في المرشحين',
    candidatesAdd: 'إضافة مرشحين جدد',
    candidatesManage: 'تعديل وحذف المرشحين',
    clientsView: 'عرض قائمة العملاء',
    clientsManage: 'إدارة العملاء (إضافة / تعديل / حذف)',
    placementsView: 'عرض التوظيفات المسجلة',
    placementsAdd: 'تسجيل توظيف جديد',
    placementsManage: 'تعديل وحذف التوظيفات',
    requestsView: 'عرض طلبات التوظيف من الشركات',
    requestsManage: 'إدارة طلبات التوظيف (إضافة / تعديل / حذف)',
    submissionsView: 'عرض الترشيحات (الانترفيو / النتيجة / المرتب)',
    submissionsAdd: 'ترشيح مرشح لطلب شركة',
    submissionsManage: 'تعديل وحذف الترشيحات (تحديث الانترفيو والنتيجة والمرتب)',
    usersManage: 'إدارة حسابات الموظفين وصلاحياتهم'
  };
  var PERMISSION_KEYS = Object.keys(PERMISSION_LABELS);

  var clientStatusLabels = { lead:'عميل محتمل', negotiating:'تفاوض', contract:'تعاقد', active:'نشط' };
  var candidateStatusLabels = { new:'متاح', interview:'في مقابلة', submitted:'تم ترشيحه', hired:'تم توظيفه', rejected:'غير متاح' };
  var placementStatusLabels = { pending:'معلق', confirmed:'مؤكد', paid:'تم الدفع' };
  var requestStatusLabels = { open:'مفتوح', filled:'مكتمل', paused:'متوقف' };
  var interviewLabels = { none:'لم يتم', scheduled:'محدد ميعاد', done:'عمل انترفيو' };
  var resultLabels = { pending:'في الانتظار', accepted:'اتقبل', rejected:'اترفض', started:'استلم الشغل' };
  function statusLabel(map, val){ return map[val] || val; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }
  function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
  function can(key){ return !!(me && (me.isOwner || (me.permissions && me.permissions[key]))); }

  async function api(method, url, body){
    var res = await fetch(url, {
      method: method,
      headers: body ? {'Content-Type':'application/json'} : undefined,
      body: body ? JSON.stringify(body) : undefined,
      credentials: 'same-origin'
    });
    var data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || 'حدث خطأ');
    return data;
  }

  // ---------- LOGIN ----------
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('loginPass').addEventListener('keydown', function(e){ if (e.key==='Enter') doLogin(); });
  document.getElementById('loginUser').addEventListener('keydown', function(e){ if (e.key==='Enter') doLogin(); });

  async function doLogin(){
    var username = document.getElementById('loginUser').value.trim();
    var password = document.getElementById('loginPass').value;
    var errEl = document.getElementById('loginError');
    errEl.textContent = '';
    if (!username || !password) { errEl.textContent = 'من فضلك ادخل اسم المستخدم وكلمة المرور'; return; }
    try {
      me = await api('POST','/api/login',{username:username,password:password});
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('app').style.display='block';
      startApp();
    } catch(e) { errEl.textContent = e.message; }
  }
  document.getElementById('logoutBtn').onclick = async function(){
    await api('POST','/api/logout');
    location.reload();
  };

  async function tryResume(){
    try { me = await api('GET','/api/me'); document.getElementById('loginScreen').style.display='none'; document.getElementById('app').style.display='block'; startApp(); }
    catch(e) { /* not logged in */ }
  }

  // ---------- NAV ----------
  function navTabsForRole(){
    var tabs = ['dashboard'];
    if (can('positionsManage')) tabs.push('positions');
    if (can('candidatesView')) tabs.push('candidates');
    if (can('clientsView') || can('clientsManage')) tabs.push('clients');
    if (can('requestsView')) tabs.push('requests');
    if (can('placementsView')) tabs.push('placements');
    if (can('usersManage')) tabs.push('users');
    return tabs;
  }
  var navIcons = { dashboard:'📊', positions:'🗂️', candidates:'👤', clients:'🏢', requests:'📋', placements:'🤝', users:'🔑' };

  function buildNav(){
    var tabs = navTabsForRole();
    navBar.innerHTML = tabs.map(function(t,i){
      return '<button data-tab="'+t+'" class="'+(i===0?'active':'')+'"><span class="icon">'+navIcons[t]+'</span>'+titles[t]+'</button>';
    }).join('');
    Array.prototype.forEach.call(navBar.querySelectorAll('button'), function(btn){
      btn.addEventListener('click', function(){
        Array.prototype.forEach.call(navBar.querySelectorAll('button'), function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        tabTitleEl.textContent = titles[currentTab];
        formOpen = null;
        pwForm = null;
        clientDetailId = null;
        if (currentTab !== 'candidates') positionFilter = null;
        render();
      });
    });
  }

  function fabAllowedForTab(){
    if (currentTab==='positions') return can('positionsManage');
    if (currentTab==='candidates') return can('candidatesAdd');
    if (currentTab==='clients') return can('clientsManage');
    if (currentTab==='placements') return can('placementsAdd');
    if (currentTab==='users') return can('usersManage');
    if (currentTab==='requests') return can('requestsManage');
    if (currentTab==='clientDetail') return can('requestsManage') || can('submissionsAdd');
    return false;
  }

  fabBtn.addEventListener('click', function(){
    if (currentTab==='positions') formOpen='position';
    else if (currentTab==='candidates') formOpen='candidate';
    else if (currentTab==='clients') formOpen='client';
    else if (currentTab==='placements') formOpen='placement';
    else if (currentTab==='users') formOpen='user';
    else if (currentTab==='requests') formOpen={type:'request', prefill:{}};
    else if (currentTab==='clientDetail') formOpen = can('requestsManage') ? {type:'request', prefill:{clientId:clientDetailId}} : {type:'submission', prefill:{clientId:clientDetailId}};
    window.scrollTo(0,0);
    render();
  });

  async function startApp(){
    document.getElementById('whoAmI').textContent = me.name + ' (' + (me.isOwner?'الحساب الرئيسي':'موظف') + ')';
    buildNav();
    await loadAll();
  }

  async function loadAll(){
    contentEl.innerHTML = '<div class="loading">جاري التحميل...</div>';
    try {
      var jobs = [];
      jobs.push(can('positionsManage') || can('candidatesAdd') || can('candidatesView') ? api('GET','/api/positions') : Promise.resolve([]));
      jobs.push(can('candidatesView') ? api('GET','/api/candidates') : Promise.resolve([]));
      jobs.push(can('clientsView') || can('clientsManage') ? api('GET','/api/clients') : Promise.resolve([]));
      jobs.push(can('placementsView') ? api('GET','/api/placements') : Promise.resolve([]));
      jobs.push(can('requestsView') ? api('GET','/api/requests') : Promise.resolve([]));
      jobs.push(can('submissionsView') ? api('GET','/api/submissions') : Promise.resolve([]));
      var results = await Promise.all(jobs);
      state.positions = results[0]; state.candidates = results[1]; state.clients = results[2]; state.placements = results[3];
      state.requests = results[4]; state.submissions = results[5];
      if (can('usersManage')) state.users = await api('GET','/api/users');
    } catch(e) { contentEl.innerHTML = '<div class="empty">تعذر تحميل البيانات: '+esc(e.message)+'</div>'; return; }
    render();
  }

  var pwForm = null; // {self:true} or {user:u}
  function render(){
    renderTab();
    if (pwForm) {
      contentEl.insertAdjacentHTML('afterbegin', passwordFormHtml());
      bindPasswordForm();
    }
  }
  function passwordFormHtml(){
    var title = pwForm.self ? 'تغيير كلمة المرور بتاعتك' : 'كلمة مرور جديدة لـ '+esc(pwForm.user.name);
    return '<div class="form-card"><h4>'+title+'</h4>' +
      (pwForm.self ? '<div class="field"><label>كلمة المرور الحالية</label><input id="pw_cur" type="password" autocomplete="current-password" /></div>' : '') +
      '<div class="field"><label>كلمة المرور الجديدة (6 حروف على الأقل)</label><input id="pw_new" type="password" autocomplete="new-password" /></div>' +
      '<div class="field"><label>اكتبها تاني</label><input id="pw_new2" type="password" autocomplete="new-password" /></div>' +
      '<div class="form-error" id="pw_err"></div>' +
      '<div class="form-actions"><button class="btn-primary" id="pw_save">حفظ</button><button class="btn-secondary" id="pw_cancel">إلغاء</button></div></div>';
  }
  function bindPasswordForm(){
    document.getElementById('pw_cancel').onclick = function(){ pwForm = null; render(); };
    document.getElementById('pw_save').onclick = async function(){
      var err = document.getElementById('pw_err');
      var nw = document.getElementById('pw_new').value, nw2 = document.getElementById('pw_new2').value;
      if (nw.length < 6) { err.textContent = 'كلمة المرور لازم تكون 6 حروف على الأقل'; return; }
      if (nw !== nw2) { err.textContent = 'كلمتين المرور مش زي بعض'; return; }
      try {
        if (pwForm.self) await api('PUT','/api/me/password',{ currentPassword: document.getElementById('pw_cur').value, newPassword: nw });
        else await api('PUT','/api/users/'+pwForm.user.id+'/password',{ password: nw });
        pwForm = null; render(); alert('اتغيرت كلمة المرور');
      } catch(e){ err.textContent = e.message; }
    };
  }
  document.getElementById('pwBtn').onclick = function(){ pwForm = { self: true }; render(); window.scrollTo(0,0); };

  function renderTab(){
    fabBtn.style.display = (currentTab!=='dashboard' && fabAllowedForTab()) ? 'flex' : 'none';
    if (currentTab==='dashboard') return renderDashboard();
    if (currentTab==='positions') return renderPositions();
    if (currentTab==='candidates') return renderCandidates();
    if (currentTab==='clients') return renderClients();
    if (currentTab==='placements') return renderPlacements();
    if (currentTab==='users') return renderUsers();
    if (currentTab==='requests') return renderRequests();

  // ---------- CLIENT REQUESTS & SUBMISSIONS ----------
  function isAccepted(x){ return x.result==='accepted' || x.result==='started'; }
  function byId(list, id){ return list.find(function(x){return x.id===id;}); }
  function clientName(id){ var c = byId(state.clients, id); return c ? c.name : 'شركة محذوفة'; }
  function candName(id){ var c = byId(state.candidates, id); return c ? c.name : 'مرشح محذوف'; }
  function fmtDate(d){ if (!d) return ''; var p = String(d).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : esc(d); }
  function today(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function money(n){ return (n===''||n==null||isNaN(n)) ? '' : Number(n).toLocaleString()+' ج.م'; }
  function opts(map, val){ return Object.entries(map).map(function(e){return '<option value="'+e[0]+'" '+(val===e[0]?'selected':'')+'>'+e[1]+'</option>';}).join(''); }
  function badgeHtml(map, val){ return val ? '<span class="badge '+escAttr(val)+'">'+esc(statusLabel(map,val))+'</span>' : ''; }
  function phoneLinks(p){
    if (!p) return '';
    var digits = String(p).replace(/\D/g,'');
    if (!digits) return '📞 '+esc(p);
    var intl = digits.charAt(0)==='0' ? '20'+digits.slice(1) : digits;
    return '📞 '+esc(p)+' <span class="links"><a href="tel:'+digits+'">اتصال</a><a href="https://wa.me/'+intl+'" target="_blank" rel="noopener">واتساب</a></span>';
  }
  function clientStats(cid){
    var reqs = state.requests.filter(function(r){return r.clientId===cid;});
    var subs = state.submissions.filter(function(s){return s.clientId===cid;});
    return {
      open: reqs.filter(function(r){return r.status==='open';}).length,
      needed: reqs.filter(function(r){return r.status==='open';}).reduce(function(a,r){return a+(Number(r.count)||0);},0),
      subs: subs.length,
      interviewed: subs.filter(function(s){return s.interview==='done';}).length,
      accepted: subs.filter(isAccepted).length,
      rejected: subs.filter(function(s){return s.result==='rejected';}).length
    };
  }

  function requestCardHtml(r, showClient){
    var subs = state.submissions.filter(function(s){return s.requestId===r.id;});

    var count = Number(r.count)||0;

    var actions = '';
    if (can('submissionsAdd')) actions += '<button class="mini-btn" onclick="PCApp.newSubmission(\''+r.clientId+'\',\''+r.id+'\')">+ رشّح مرشح</button>';
    if (can('requestsManage')) actions += '<button class="mini-btn" onclick="PCApp.editRequest(\''+r.id+'\')">تعديل</button><button class="mini-btn danger" onclick="PCApp.deleteRequest(\''+r.id+'\')">حذف</button>';

      '<div class="meta">' + (showClient ? '🏢 <a href="#" onclick="PCApp.viewClient(\''+r.clientId+'\');return false" style="color:inherit">'+esc(clientName(r.clientId))+'</a><br>' : '') +
        '👥 مطلوب: '+count+' — مترشح: '+subs.length+' — اتقبل: '+acc +
        (r.salaryRange ? '<br>💰 '+esc(r.salaryRange) : '') + (r.date ? '<br>📅 '+fmtDate(r.date) : '') + (r.notes ? '<br>📝 '+esc(r.notes) : '') +

  function bindSubmissionForm(){
    var saveBtn = document.getElementById('s_save');
    if (!saveBtn) return;
    var d = formOpen.data || formOpen.prefill || {};
    document.getElementById('s_cancel').onclick = function(){ formOpen=null; render(); };
    var clientSel = document.getElementById('s_client'), reqSel = document.getElementById('s_req');
    function fillReqs(selected){
      reqSel.innerHTML = '<option value="">بدون طلب محدد</option>' + state.requests.filter(function(r){return r.clientId===clientSel.value;})
        .map(function(r){return '<option value="'+r.id+'" '+(selected===r.id?'selected':'')+'>'+esc(r.title)+' ('+esc(statusLabel(requestStatusLabels,r.status))+')</option>';}).join('');
    }
    fillReqs(d.requestId);
    clientSel.onchange = function(){ fillReqs(''); };
    var candSel = document.getElementById('s_cand'), newBox = document.getElementById('s_newcand');
    if (candSel && newBox) { var t = function(){ newBox.style.display = candSel.value==='__new' ? 'block' : 'none'; }; candSel.onchange = t; t(); }
    saveBtn.onclick = async function(){
      var err = document.getElementById('s_err');
      var obj = { requestId: reqSel.value, clientId: clientSel.value, interview: document.getElementById('s_interview').value,
        interviewDate: document.getElementById('s_idate').value, result: document.getElementById('s_result').value,
        salary: document.getElementById('s_salary').value, notes: document.getElementById('s_notes').value.trim() };
      if (!obj.clientId) { err.textContent = 'اختر الشركة'; return; }
      saveBtn.disabled = true;
      try {
        if (formOpen.data) { await api('PUT','/api/submissions/'+formOpen.data.id, obj); }
        else {
          var candId = candSel ? candSel.value : '';
          if (candId === '__new') {
            var nm = document.getElementById('s_newname').value.trim();
            if (!nm) { saveBtn.disabled = false; err.textContent = 'اكتب اسم المرشح'; return; }
            var req = byId(state.requests, obj.requestId);
            var created = await api('POST','/api/candidates', { name:nm, phone:document.getElementById('s_newphone').value.trim(),
              positionId: req && req.positionId ? req.positionId : '', status: obj.interview==='none' ? 'submitted' : 'interview' });
            candId = created.id;
          }
          if (!candId) { saveBtn.disabled = false; err.textContent = 'اختر المرشح'; return; }
          obj.candidateId = candId;
          await api('POST','/api/submissions', obj);
        }
        formOpen=null; await loadAll();
      } catch(e){ saveBtn.disabled = false; err.textContent = e.message; }
    };
  }

  // ---------- EXCEL EXPORT (one sheet per company) ----------
  function sheetName(n, used){
    var s = String(n||'شركة').replace(/[\[\]\:\*\?\/\\]/g,' ').slice(0,28).trim() || 'شركة', base = s, i = 2;
    while (used[s]) { s = base.slice(0,25)+' '+(i++); }
    used[s] = true; return s;
  }
  PCApp.exportExcel = function(onlyClientId){
    if (!window.XLSX) { alert('مكتبة الإكسل مش متاحة دلوقتي'); return; }
    var wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
    var used = {};
    var clients = onlyClientId ? state.clients.filter(function(c){return c.id===onlyClientId;}) : state.clients;
    if (!onlyClientId) {
      var sum = [['الشركة','المسؤول','رقم التواصل','مطلوب حاليًا','مرشحين','عملوا انترفيو','اتقبلوا','اترفضوا']];
      clients.forEach(function(c){ var st = clientStats(c.id); sum.push([c.name, c.contact||'', c.phone||'', st.needed, st.subs, st.interviewed, st.accepted, st.rejected]); });
      var ws0 = XLSX.utils.aoa_to_sheet(sum); ws0['!cols'] = [{wch:24},{wch:16},{wch:16},{wch:12},{wch:9},{wch:13},{wch:9},{wch:9}];
      XLSX.utils.book_append_sheet(wb, ws0, sheetName('ملخص الشركات', used));
    }
    clients.forEach(function(c){
      var open = state.requests.filter(function(r){return r.clientId===c.id && r.status==='open';});
      var rows = [['الشركة', c.name], ['طلبات مفتوحة', open.map(function(r){return r.title+' ('+(r.count||0)+')';}).join('، ')], [],
        ['اسم المرشح','رقم التواصل','الوظيفة','عمل انترفيو؟','تاريخ الانترفيو','النتيجة','المرتب','ملاحظات']];
      state.submissions.filter(function(s){return s.clientId===c.id;}).forEach(function(s){
        var cand = byId(state.candidates, s.candidateId) || {}; var req = byId(state.requests, s.requestId);
        rows.push([cand.name||'', cand.phone||'', req?req.title:'', statusLabel(interviewLabels,s.interview), fmtDate(s.interviewDate),
          statusLabel(resultLabels,s.result), s.salary===''||s.salary==null?'':Number(s.salary), s.notes||'']);
      });
      var ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:22},{wch:15},{wch:16},{wch:13},{wch:14},{wch:13},{wch:11},{wch:30}];
      for (var r=4; r<rows.length; r++){ var a = XLSX.utils.encode_cell({r:r,c:1}); if (ws[a]) ws[a].t='s'; }
      XLSX.utils.book_append_sheet(wb, ws, sheetName(c.name, used));
    });
    XLSX.writeFile(wb, (onlyClientId ? clientName(onlyClientId) : 'طلبات الشركات') + ' ' + today() + '.xlsx');
  };

  PCApp.viewClient = function(id){ clientDetailId = id; formOpen = null; goTab('clientDetail'); };
  PCApp.backToClients = function(){ clientDetailId = null; formOpen = null; goTab('clients'); };
  PCApp.newRequest = function(clientId){ formOpen = {type:'request', prefill:{clientId:clientId}}; render(); window.scrollTo(0,0); };
  PCApp.editRequest = function(id){ formOpen = {type:'request', data: byId(state.requests, id)}; render(); window.scrollTo(0,0); };
  PCApp.deleteRequest = async function(id){
    if (!confirm('مسح طلب التوظيف ده؟ المرشحين المترشحين ليه هيفضلوا في ملف الشركة.')) return;
    try { await api('DELETE','/api/requests/'+id); await loadAll(); } catch(e){ alert(e.message); }
  };
  PCApp.newSubmission = function(clientId, requestId){ formOpen = {type:'submission', prefill:{clientId:clientId, requestId:requestId||''}}; render(); window.scrollTo(0,0); };
  PCApp.editSubmission = function(id){ formOpen = {type:'submission', data: byId(state.submissions, id)}; render(); window.scrollTo(0,0); };
  PCApp.deleteSubmission = async function(id){
    if (!confirm('مسح الترشيح ده؟ المرشح هيفضل موجود في بنك المرشحين.')) return;
    try { await api('DELETE','/api/submissions/'+id); await loadAll(); } catch(e){ alert(e.message); }
  };
  PCApp.submissionToPlacement = function(id){
    var s = byId(state.submissions, id); if (!s) return;
    var req = byId(state.requests, s.requestId);
    clientDetailId = null;
    formOpen = {type:'placement', prefill:{candidateId:s.candidateId, clientId:s.clientId, positionId: req && req.positionId ? req.positionId : '', salary: s.salary===''?'':s.salary, status:'pending'}};
    goTab('placements');
  };

  tryResume();
})();
</script>
