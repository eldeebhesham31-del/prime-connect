# Render Blueprint: New > Blueprint > pick this repo.
# DATABASE_URL: paste the Postgres connection string (Neon free tier recommended — it does not expire).
services:
  - type: web
    name: prime-connect
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
